    },
    {

      "options": [

    {

      "title": "第12(2) 条件探究：把「结论」倒推成「条件」",
      "html": "<p>第(2)问换成了等腰直角 △ABC（∠ABC=90°，AB=BC），其他照旧：△BAO 绕 B 顺时针旋转到 △BCD，问 <b>OA、OB、OC 满足什么条件时 ∠ODC=90°</b>。</p><img src=\"d0910_q12b.jpg\" style=\"width:100%;max-width:430px;border:1px solid #ddd;border-radius:8px;display:block;margin:8px auto\"><p><b>第一步：旋转后有什么（和第(1)问一样的两件套）</b></p><p>🔹 旋转角 = ∠ABC = <b>90°</b>；BD = BO，∠OBD = 90° → △BOD 是<b>等腰直角三角形</b> → OD = √2·OB，∠BDO = 45°</p><p>🔹 CD = OA（旋转搬运）</p><p><b>第二步：把「∠ODC=90°」翻译成勾股</b></p><p style='background:#fff8ec;border:2px solid #e67e22;border-radius:10px;padding:12px 16px;line-height:2'>∠ODC = 90° ⇔ △ODC 是直角三角形 ⇔ OC² = OD² + CD²<br>⇔ OC² = (√2·OB)² + OA²<br>⇔ <b style='color:#c0392b'>OA² + 2OB² = OC²</b></p><p><b>第三步：反过来验证</b>——当 OA²+2OB²=OC² 时，△ODC 满足勾股定理（逆定理），∠ODC 必为 90°。所以这就是所求条件，证明写「⇒」和「⇐」各一遍即可。</p>"
    },
    {
      "kind": "summary",
      "tag": "a6",
      "title": "第12题母套路：旋转三件套",
      "html": "<p><b>等腰三角形（等边/等腰直角）里绕顶点旋转，永远先做这三件事：</b></p><p>1️⃣ <b>定旋转角</b>：旋转角 = 顶角（等边 60°、等腰直角 90°）</p><p>2️⃣ <b>找副产品三角形</b>：旋转中心那个顶点 + 原像 + 像 → 旋转 60° 得<b>等边三角形</b>，旋转 90° 得<b>等腰直角三角形</b>（这个三角形专门负责提供 60° 或 45° 的角）</p><p>3️⃣ <b>搬线段凑勾股</b>：对应边相等，把三条分散的线段凑成一个三角形，再看它是不是直角三角形</p><p style='background:#eef5ff;border-radius:10px;padding:10px 14px'>💡 12(1) 的答案链：60° → OD=4 → △ODC 是 3-4-5 → ∠ODC=90° → ∠BDC=60°+90°=150°</p>"
    },

      "html": "<p>题目：等腰直角 △ABC（∠CAB=90°，AB=AC），E、F 在斜边 BC 上，∠EAF=45°。求证 <b>EF²=BE²+FC²</b>。</p><img src=\"d0910_q13b.jpg\" style=\"width:100%;max-width:430px;border:1px solid #ddd;border-radius:8px;display:block;margin:8px auto\"><p><b>难点在哪？</b>EF、BE、FC 三条线段都躺在同一条直线 BC 上——它们<b>根本围不成三角形</b>，勾股定理用不上。</p><p><b>破局思路</b>：还是「搬运」！把 BE 搬到和 FC 垂直的位置去。</p><p><b>操作</b>：把 △ABE 绕点 A <b>逆时针旋转 90°</b>（AB 转到 AC），E 的像记为 E′：</p><p>🔹 AE′ = AE，CE′ = BE（搬运），∠BAE = ∠CAE′</p><p>🔹 求 ∠FAE′：∠FAE′ = ∠FAC + ∠CAE′ = ∠FAC + ∠BAE。<br>　而 ∠EAF = 45°，∠BAC = 90°，所以 ∠BAE + ∠FAC = 90° − 45° = 45°。<br>　→ <b>∠FAE′ = 45° = ∠EAF</b></p><p>🔹 加上 AF 是公共边 → <b>△AEF ≌ △AE′F（SAS）</b> → <b>EF = E′F</b></p><p>现在三条线段变成了 E′F、CE′（=BE）、FC——只要 CE′ ⊥ FC，就能用勾股了！</p>\n<svg viewBox=\"0 0 350 285\" style=\"width:100%;max-width:430px;background:#fff;border:1px solid #ddd;border-radius:8px\">\n  <polygon points=\"60,230 170,120 280,230\" fill=\"#eef5ff\" stroke=\"none\"/>\n  <polygon points=\"170,120 280,230 280,165.6\" fill=\"#eaf7ef\" stroke=\"none\" opacity=\"0.85\"/>\n  <line x1=\"60\" y1=\"230\" x2=\"170\" y2=\"120\" stroke=\"#4a7dbd\" stroke-width=\"2\"/>\n  <line x1=\"170\" y1=\"120\" x2=\"280\" y2=\"230\" stroke=\"#4a7dbd\" stroke-width=\"2\"/>\n  <line x1=\"280\" y1=\"230\" x2=\"60\" y2=\"230\" stroke=\"#4a7dbd\" stroke-width=\"2\"/>\n  <line x1=\"170\" y1=\"120\" x2=\"124.4\" y2=\"230\" stroke=\"#e67e22\" stroke-width=\"2\"/>\n  <line x1=\"170\" y1=\"120\" x2=\"215.6\" y2=\"230\" stroke=\"#e67e22\" stroke-width=\"2\"/>\n  <line x1=\"170\" y1=\"120\" x2=\"280\" y2=\"165.6\" stroke=\"#3d9c63\" stroke-width=\"2.2\"/>\n  <line x1=\"280\" y1=\"165.6\" x2=\"215.6\" y2=\"230\" stroke=\"#c0392b\" stroke-width=\"2.4\" stroke-dasharray=\"7 4\"/>\n  <line x1=\"280\" y1=\"230\" x2=\"280\" y2=\"165.6\" stroke=\"#3d9c63\" stroke-width=\"2.2\"/>\n  <path d=\"M 270 220 L 280 220 L 280 230\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"1.5\"/>\n  <path d=\"M 152 136 A 26 26 0 0 0 190 137\" fill=\"none\" stroke=\"#8e44ad\" stroke-width=\"1.8\"/>\n  <line x1=\"82\" y1=\"230\" x2=\"82\" y2=\"222\" stroke=\"#e67e22\" stroke-width=\"1.6\"/>\n  <line x1=\"78\" y1=\"230\" x2=\"78\" y2=\"222\" stroke=\"#e67e22\" stroke-width=\"1.6\"/>\n  <line x1=\"276\" y1=\"212\" x2=\"284\" y2=\"212\" stroke=\"#3d9c63\" stroke-width=\"1.6\"/>\n  <line x1=\"276\" y1=\"208\" x2=\"284\" y2=\"208\" stroke=\"#3d9c63\" stroke-width=\"1.6\"/>\n  <circle cx=\"170\" cy=\"120\" r=\"4\" fill=\"#2c3e50\"/><circle cx=\"60\" cy=\"230\" r=\"4\" fill=\"#2c3e50\"/>\n  <circle cx=\"280\" cy=\"230\" r=\"4\" fill=\"#2c3e50\"/><circle cx=\"124.4\" cy=\"230\" r=\"4\" fill=\"#2c3e50\"/>\n  <circle cx=\"215.6\" cy=\"230\" r=\"4\" fill=\"#2c3e50\"/><circle cx=\"280\" cy=\"165.6\" r=\"4.5\" fill=\"#3d9c63\"/>\n  <text x=\"164\" y=\"110\" font-size=\"14\" fill=\"#2c3e50\" font-weight=\"bold\">A</text>\n  <text x=\"46\" y=\"244\" font-size=\"14\" fill=\"#2c3e50\" font-weight=\"bold\">B</text>\n  <text x=\"288\" y=\"244\" font-size=\"14\" fill=\"#2c3e50\" font-weight=\"bold\">C</text>\n  <text x=\"120\" y=\"246\" font-size=\"14\" fill=\"#2c3e50\" font-weight=\"bold\">E</text>\n  <text x=\"212\" y=\"246\" font-size=\"14\" fill=\"#2c3e50\" font-weight=\"bold\">F</text>\n  <text x=\"288\" y=\"162\" font-size=\"14\" fill=\"#3d9c63\" font-weight=\"bold\">E′</text>\n  <text x=\"156\" y=\"152\" font-size=\"11.5\" fill=\"#8e44ad\">45°</text>\n  <text x=\"86\" y=\"222\" font-size=\"11\" fill=\"#e67e22\">BE</text>\n  <text x=\"240\" y=\"216\" font-size=\"11\" fill=\"#3d9c63\">CE′</text>\n  <text x=\"244\" y=\"200\" font-size=\"11.5\" fill=\"#c0392b\">EF=E′F</text>\n  <text x=\"282\" y=\"196\" font-size=\"11.5\" fill=\"#c0392b\">90°</text>\n  <text x=\"176\" y=\"140\" font-size=\"11\" fill=\"#3d9c63\">旋转 90°</text>\n</svg>"

y=\"256\" font-size=\"14\" fill=\"#2c3e50\" font-weight=\"bold\">B</text>\n  <text x=\"138\" y=\"266\" font-size=\"14\" fill=\"#2c3e50\" font-weight=\"bold\">C</text>\n  <text x=\"172\" y=\"226\" font-size=\"13\" fill=\"#e67e22\" font-weight=\"bold\">O</text>\n  <text x=\"74\" y=\"212\" font-size=\"14\" fill=\"#c0392b\" font-weight=\"bold\">A′</text>\n  <text x=\"130\" y=\"242\" font-size=\"12\" fill=\"#c0392b\" font-weight=\"bold\">O′</text>\n  <text x=\"90\" y=\"262\" font-size=\"11.5\" fill=\"#c0392b\">OA+OB+OC = A′B</text>\n  <text x=\"96\" y=\"200\" font-size=\"11\" fill=\"#3d9c63\">旋转 60°</text>\n  <text x=\"196\" y=\"238\" font-size=\"11\" fill=\"#e67e22\">120°</text>\n</svg><p>🔹 △COO′ 中 CO=CO′、∠OCO′=60° → <b>等边三角形</b> → OO′ = OC，∠COO′=60°</p><p>🔹 △A′O′C ≌ △AOC → <b>A′O′ = AO</b>，∠A′O′C = ∠AOC = 120°</p><p>🔹 <b>四点共线的理由</b>：∠A′O′O = ∠A′O′C − ∠OO′C... 换个更直白的说法——<br>在 O′ 处：∠A′O′O = 180°（120° + 等边三角形的 60° 恰好拼成平角）；<br>在 O 处：∠BOO′ = 180°（∠BOC=120° + ∠COO′=60°）。<br>两个平角把 A′、O′、O、B 钉在同一根直线上！</p><p style='background:#fff8ec;border:2px solid #e67e22;border-radius:10px;padding:12px 16px;line-height:2;font-size:15px'>于是：OA + OB + OC = A′O′ + OO′ + OB = <b style='color:#c0392b'>A′B</b>（一条线段！）</p><p>三条线段成功「焊接」成一条。下一步只要算 A′B 就行了。</p>"

1.5\" fill=\"#4a7dbd\">CB=√3</text>\n  <text x=\"62\" y=\"234\" font-size=\"11.5\" fill=\"#8e44ad\">A′H=½</text>\n  <text x=\"112\" y=\"266\" font-size=\"11.5\" fill=\"#8e44ad\">CH=√3/2</text>\n  <text x=\"196\" y=\"268\" font-size=\"11.5\" fill=\"#c0392b\">HB=3√3/2</text>\n  <text x=\"132\" y=\"242\" font-size=\"11\" fill=\"#8e44ad\">30°</text>\n  <text x=\"150\" y=\"214\" font-size=\"12\" fill=\"#c0392b\" font-weight=\"bold\">A′B² = ¼ + 27/4 = 7</text>\n</svg><p style='line-height:2'>🔹 Rt△A′CH：CA′=1 是斜边，∠A′CH=30° → <b>A′H = ½</b>，<b>CH = √3/2</b><br>🔹 <b>HB = HC + CB = √3/2 + √3 = 3√3/2</b><br>🔹 Rt△A′HB：A′B² = A′H² + HB² = (½)² + (3√3/2)² = ¼ + 27/4 = <b style='color:#c0392b'>7</b></p>"

window.COURSE = COURSE;


/* ===================== 渲染引擎（一般不用改） ===================== */
const stage = document.getElementById('stage');
document.getElementById('courseTitle').textContent = COURSE.title;
document.getElementById('courseSub').textContent = COURSE.subtitle;
const bar = document.getElementById('bar');
let cur = 0;

function scrollTop(){
  const el = document.querySelector('.wrap');
  if (el && el.scrollIntoView) { try{ el.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){} }
}

function render(i){
  cur = i;
  const total = COURSE.steps.length;
  bar.style.width = Math.round((i)/(total-1)*100) + '%';
  stage.innerHTML = '';
  const s = COURSE.steps[i];
  const card = document.createElement('div');
  card.className = 'step active';
  let inner = '';
  if (s.tag) inner += `<span class="tag">${s.tag}</span>`;
  inner += `<h2>${s.title}</h2>`;
  if (s.kind === 'quiz'){
    inner += `<p>${s.prompt}</p><div class="opts" id="opts"></div><div class="fb" id="fb"></div>`;
  } else {
    inner += s.html || '';
  }
  // 导航按钮
  const isLast = (i === total-1);
  inner += `<div class="nav">`;
  inner += i>0 ? `<button class="btn btn-back" id="back">← 上一步</button>` : `<span></span>`;
  if (!isLast){
    inner += `<button class="btn btn-next" id="next">下一步 →</button>`;
  } else if (s.kind !== 'summary'){
    inner += `<button class="btn btn-next" id="next">完成 ✓</button>`;
  } else {
    inner += `<span></span>`;
  }
  inner += `</div>`;
  card.innerHTML = inner;
  stage.appendChild(card);

  if (s.kind === 'quiz') buildQuiz(s, card);
  // 绑定导航
  const nextBtn = card.querySelector('#next');
  if (nextBtn){
    if (s.kind === 'quiz'){ nextBtn.disabled = true; } // 答题后才解锁
    nextBtn.addEventListener('click', ()=>{ if(!nextBtn.disabled) render(i+1); });
  }
  const backBtn = card.querySelector('#back');
  if (backBtn) backBtn.addEventListener('click', ()=> render(i-1));
  scrollTop();
}

function buildQuiz(s, card){
  const optsBox = card.querySelector('#opts');
  const fb = card.querySelector('#fb');
  const nextBtn = card.querySelector('#next');
  s.options.forEach((o, idx)=>{
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="mk">${String.fromCharCode(65+idx)}</span><span>${o.t}</span>`;
    div.addEventListener('click', ()=>{
      // 锁定所有选项（避免重复点）
      optsBox.querySelectorAll('.opt').forEach(el=>{ el.classList.add('locked'); });
      // 先启用"下一步"（关键：绝不被反馈 handler 卡住）
      if (nextBtn) nextBtn.disabled = false;
      // 标出对错
      div.classList.add(o.ok ? 'correct' : 'wrong', 'chosen');
      if (!o.ok){
        // 顺便高亮正确答案，让学生看到正解
        optsBox.querySelectorAll('.opt').forEach((el,k)=>{ if(s.options[k].ok) el.classList.add('correct'); });
      }
      // 揭示评语（try/catch 兜底）
      try{
        fb.className = 'fb show ' + (o.ok ? 'ok' : 'bad');
        fb.innerHTML = (o.ok ? '✅ <b>答对了：</b>' : '⚠️ <b>再看一眼：</b>') + o.why;
      }catch(e){ /* 反馈出错也不影响下一步 */ }
      scrollTop();
    });
    optsBox.appendChild(div);
  });
}

render(0);
</script>
</body>
</html>
