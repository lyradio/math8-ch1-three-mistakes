  =====================================================================

  怎么用：复制本文件，只改下面的 COURSE 对象即可，不要从零写 HTML。

    ✅ 原生 CSS，不用 Tailwind @apply
    ✅ 选项绝不预显示"对/接近/反了"——评语只在点击后揭示

    ✅ 不用 split('-') 解析 dash（旧坑：c1-1 → NaN → 下一步死锁）

<style>

    display:none}

var COURSE = {
  "title": "第一章学情调研 · 错题归因特训",

  "steps": [
    {
      "kind": "read",
      "tag": "开场",
      "title": "先说结论：89 分不是「9 个坑」，是「4 个漏洞」",
      "html": "<p>这份卷子 120 分满分，你拿了 <b>89 分</b>，错 9 处。你可能会想：<b>「我都做了 10 张卷子了，怎么还有这么多不会？」</b></p><p>我把你 9 处错题一处一处看过了（包括你在卷子上写的草稿），结论是——<b>这 9 处错题不是 9 个互不相干的坑，它们背后只有 4 个漏洞。</b></p><table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:10px 0\"><tr style=\"background:#eef1fe\"><th style=\"border:1px solid #dfe3ee;padding:8px 6px\">漏洞</th><th style=\"border:1px solid #dfe3ee;padding:8px 6px\">对应错题</th><th style=\"border:1px solid #dfe3ee;padding:8px 6px\">一句话说清</th></tr><tr><td style=\"border:1px solid #dfe3ee;padding:8px 6px\"><b>① 只会「正着用」，<br>不会「倒着用」</b></td><td style=\"border:1px solid #dfe3ee;padding:8px 6px\">14、17</td><td style=\"border:1px solid #dfe3ee;padding:8px 6px\">给三边 → 判直角，这一步没有形成条件反射</td></tr><tr><td style=\"border:1px solid #dfe3ee;padding:8px 6px\"><b>② 不会「翻译」<br>成直角三角形</b></td><td style=\"border:1px solid #dfe3ee;padding:8px 6px\">5、6、9、16</td><td style=\"border:1px solid #dfe3ee;padding:8px 6px\">生活情境、复杂图、立体图 → 不知道往哪个方向转化</td></tr><tr><td style=\"border:1px solid #dfe3ee;padding:8px 6px\"><b>③ 不会「算几项<br>推通项」</b></td><td style=\"border:1px solid #dfe3ee;padding:8px 6px\">10</td><td style=\"border:1px solid #dfe3ee;padding:8px 6px\">规律题不敢代几项算，直接凭感觉选</td></tr><tr><td style=\"border:1px solid #dfe3ee;padding:8px 6px\"><b>④ 多层综合<br>就「断链」</b></td><td style=\"border:1px solid #dfe3ee;padding:8px 6px\">21(3)、25</td><td style=\"border:1px solid #dfe3ee;padding:8px 6px\">超过两层就停笔，不会拆步骤拿分</td></tr></table><div class=\"note\"><b>这就是「为什么刷了 10 张卷子还有这么多错」的答案：</b><br>你刷的卷子里，能做的题都是<b>「直球」</b>（给你直角三角形、给你两边、求第三边），而错的全是<b>「要先转化的球」</b>。刷题量练的是<b>熟练度</b>，但这 4 个漏洞靠的是<b>识别力</b>——不同的东西，刷再多同类型的题也补不上。</div>"
    },
    {
      "kind": "read",
      "tag": "A",
      "title": "漏洞①：勾股定理，你只会「正着用」",
      "html": "<p>勾股定理有两个方向，很多人只知道第一个：</p><table style=\"width:100%;border-collapse:collapse;font-size:14.5px;margin:10px 0\"><tr style=\"background:#eef1fe\"><th style=\"border:1px solid #dfe3ee;padding:9px 6px\">方向</th><th style=\"border:1px solid #dfe3ee;padding:9px 6px\">人话</th><th style=\"border:1px solid #dfe3ee;padding:9px 6px\">已知什么</th><th style=\"border:1px solid #dfe3ee;padding:9px 6px\">能干什么</th></tr><tr><td style=\"border:1px solid #dfe3ee;padding:9px 6px\"><b>正着用</b><br>（定理）</td><td style=\"border:1px solid #dfe3ee;padding:9px 6px\">先知道它是直角三角形</td><td style=\"border:1px solid #dfe3ee;padding:9px 6px\">直角 + 两条边</td><td style=\"border:1px solid #dfe3ee;padding:9px 6px\">求第三条边</td></tr><tr><td style=\"border:1px solid #dfe3ee;padding:9px 6px\"><b>倒着用</b><br>（逆定理）</td><td style=\"border:1px solid #dfe3ee;padding:9px 6px\"><b>反过来，用边去「验」它是不是直角三角形</b></td><td style=\"border:1px solid #dfe3ee;padding:9px 6px\">三条边（都不知道有没有直角）</td><td style=\"border:1px solid #dfe3ee;padding:9px 6px\">判定它是不是直角三角形、哪个角是直角</td></tr></table><p>你这次错的 14 题、17 题，<b>全部死在「倒着用」上</b>。</p><div class=\"note\">「正着用」是<b>照着图纸施工</b>；「倒着用」是<b>拿着材料去反推它能不能拼成直角</b>。后者难，但它才是压轴题的常客。</div>\n<svg viewBox=\"0 0 460 250\" style=\"width:100%;max-width:470px;background:#fff;border:1px solid #ddd;border-radius:8px\">\n  <text x=\"16\" y=\"26\" font-size=\"14.5\" fill=\"#2c3e50\" font-weight=\"bold\">看到三条边 → 先算「两小平方和」再比「最大平方」</text>\n  <rect x=\"24\" y=\"46\" width=\"150\" height=\"66\" rx=\"10\" fill=\"#eef1fe\" stroke=\"#4f6ef7\" stroke-width=\"1.6\"/>\n  <text x=\"44\" y=\"74\" font-size=\"14\" fill=\"#2f3a56\">第一步：找最长边 c</text>\n  <text x=\"44\" y=\"98\" font-size=\"13\" fill=\"#5b6472\">（先排个序，最长的一定是斜边候选）</text>\n  <rect x=\"190\" y=\"46\" width=\"150\" height=\"66\" rx=\"10\" fill=\"#e7f7ef\" stroke=\"#1f9d6b\" stroke-width=\"1.6\"/>\n  <text x=\"210\" y=\"74\" font-size=\"14\" fill=\"#2f3a56\">第二步：算 a² + b²</text>\n  <text x=\"210\" y=\"98\" font-size=\"13\" fill=\"#5b6472\">两条短边各自平方再相加</text>\n  <rect x=\"356\" y=\"46\" width=\"0\" height=\"0\" fill=\"none\"/>\n  <rect x=\"96\" y=\"138\" width=\"270\" height=\"80\" rx=\"10\" fill=\"#fff8e6\" stroke=\"#b7791f\" stroke-width=\"1.6\"/>\n  <text x=\"120\" y=\"166\" font-size=\"14\" fill=\"#7a5a12\">第三步：比大小</text>\n  <text x=\"120\" y=\"190\" font-size=\"13.5\" fill=\"#2f3a56\">a²+b² = c² → 直角三角形（直角对着最长边）</text>\n  <text x=\"120\" y=\"210\" font-size=\"13.5\" fill=\"#2f3a56\">a²+b² ≠ c² → 不是直角三角形</text>\n  <path d=\"M 174 112 L 174 134 L 230 134\" stroke=\"#4f6ef7\" stroke-width=\"1.8\" fill=\"none\" marker-end=\"url(#arrRt)\"/>\n  <defs><marker id=\"arrRt\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\">\n    <path d=\"M0,0 L7,3 L0,6 Z\" fill=\"#4f6ef7\"/></marker></defs>\n  <text x=\"196\" y=\"132\" font-size=\"12\" fill=\"#4f6ef7\">走这一步</text>\n</svg>\n"
    },
    {
      "kind": "read",
      "tag": "A",
      "title": "逆定理的三种「出场信号」——看到就该警觉",
      "html": "<p>不会用逆定理，往往是因为<b>不知道它什么时候出场</b>。记住这三个信号：</p><div class=\"note\"><b>信号 1：题目给了三条边的长度（或给了三条边的平方关系），要你求角度 / 判断形状。</b><br>→ 立刻算「两小平方和」和「最大平方」，比一比。</div><p><b>信号 2：题目给的三个数看着眼熟。</b>常见的勾股数要背下来：</p><table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:8px 0\"><tr style=\"background:#e7f7ef\"><td style=\"border:1px solid #dfe3ee;padding:7px\">3,4,5</td><td style=\"border:1px solid #dfe3ee;padding:7px\">5,12,13</td><td style=\"border:1px solid #dfe3ee;padding:7px\">6,8,10</td><td style=\"border:1px solid #dfe3ee;padding:7px\">7,24,25</td><td style=\"border:1px solid #dfe3ee;padding:7px\">8,15,17</td></tr><tr style=\"background:#e7f7ef\"><td style=\"border:1px solid #dfe3ee;padding:7px\">9,40,41</td><td style=\"border:1px solid #dfe3ee;padding:7px\">1,1,√2</td><td style=\"border:1px solid #dfe3ee;padding:7px\">1,√3,2</td><td style=\"border:1px solid #dfe3ee;padding:7px\">1,2,√5</td><td style=\"border:1px solid #dfe3ee;padding:7px\">2,3,√13</td></tr></table><div class=\"note\"><b>信号 3：两条线段的平方和（或差）刚好等于第三条的平方。</b><br>比如「AB² + BC² = AC²」这种式子一旦出现，就是在喊：「我是直角三角形！」</div><p style=\"color:#c0392b\"><b>一句话：只要题目里出现了「三条边的平方」，你的笔就应该先去算那两个平方和。</b></p>"
    },
    {
      "kind": "quiz",
      "tag": "A",
      "title": "实战：第 14 题，你该先算什么",
      "prompt": "<p>题目：∠BAC = 90°，AB = 4，AC = 4，BD = 7，DC = 9，求 ∠DBA。</p><p>这条题你留白了。<b>看到「4、4、7、9」这一堆数字，第一步最应该干什么？</b></p><img src=\"e0913_q14.jpg\" style=\"width:100%;max-width:470px;border:1px solid #ddd;border-radius:8px;display:block;margin:10px auto\">",
      "options": [
        {
          "t": "A. 把 AB = 4、AC = 4 用上，先算出 BC = 4√2；再看 BD² + BC² 是不是等于 DC²",
          "ok": true,
          "why": "✅ <b>这就是唯一正确的起手式。</b><br>AB = AC = 4 且 ∠BAC = 90° → △ABC 是<b>等腰直角三角形</b>，BC² = 4²+4² = 32，BC = 4√2。<br>然后验算：BD² + BC² = 7² + 32 = 49 + 32 = <b>81</b>，而 DC² = 9² = <b>81</b>。<br><b>相等！</b>所以 △DBC 是直角三角形，∠DBC = 90°。<br>于是 ∠DBA = ∠DBC − ∠ABC = 90° − 45° = <b>45°</b>。<br><span style=\"color:#c0392b\">注意：这一整套动作的核心，就是「倒着用」——先算出 BC，再拿三边去验直角。</span>"
        },
        {
          "t": "B. 直接用 7 和 9 算三角形 DBC 的面积",
          "ok": false,
          "why": "❌ 光知道 BD = 7、DC = 9 两条边，算不出面积（还缺夹角）。而且题目要的是<b>角</b>，不是面积——你的方向从一开始就偏了。"
        },
        {
          "t": "C. 用勾股定理直接求 AD",
          "ok": false,
          "why": "❌ 想求 AD 得先知道某个直角三角形，但 △ADC 和 △ADB 你都还不知道有没有直角。得先靠逆定理把直角「验出来」，这一步不能跳。"
        }
      ]
    },
    {
      "kind": "read",
      "tag": "A",
      "title": "第 14 题完整解答 + 这类题的固定套路",
      "html": "<p><b>标准解答（照这个格式写）：</b></p><div class=\"note\">∵ ∠BAC = 90°，AB = AC = 4<br>∴ △ABC 是等腰直角三角形，BC² = AB² + AC² = 4² + 4² = 32，∠ABC = 45°<br>在 △DBC 中：BD² + BC² = 7² + 32 = 49 + 32 = 81，DC² = 9² = 81<br>∴ BD² + BC² = DC²<br>∴ △DBC 是直角三角形，<b>∠DBC = 90°</b>（直角对着最长边 DC）<br>∴ ∠DBA = ∠DBC − ∠ABC = 90° − 45° = <b>45°</b></div><p><b>把它抽象成套路：</b></p><ol><li>题目给了一个<b>已知形状的图形</b>（等腰直角、等边等）→ 先把能算的都算出来（BC、角度）</li><li>题目给了<b>另外一组边</b>（BD、DC）→ 立刻用逆定理去验有没有隐藏的直角</li><li>两个直角 + 已知角度一减，答案就出来了</li></ol><div class=\"note\" style=\"border-left-color:#c0392b\"><b>这道题最值钱的一句话：</b><br>「<b>4、4、7、9</b>」里藏着「<b>7² + 32 = 81</b>」——这种「算出来刚好相等」的感觉，就是逆定理题的手感。多练几次就成条件反射了。</div>"
    },
    {
      "kind": "quiz",
      "tag": "A",
      "title": "第 17 题：你的草稿错在哪",
      "prompt": "<p>题目：m 是大于 1 的整数，a = 2m，b = m²−1，c = m²+1，求证 a、b、c 为勾股数。</p><p>你在卷子上写的是：</p><div class=\"note\" style=\"background:#fdecea;border-left-color:#e0533d\">(m+1)² = m² + 1 + 2m　　(m−1)² = m² + 1 − 2m<br>(m+1)² = (m−1)² + 4m<br>∵ a = 2m，b = m²−1，c = m²+1　∴ c + a = ...（写不下去了）</div><p><b>问题出在哪？</b></p><img src=\"e0913_q17.jpg\" style=\"width:100%;max-width:470px;border:1px solid #ddd;border-radius:8px;display:block;margin:10px auto\">",
      "options": [
        {
          "t": "A. 他把 b = m²−1 当成 (m−1)² 去算了，完全跑偏",
          "ok": true,
          "why": "✅ <b>抓到了。</b>b 是 m² − 1（平方差），不是 (m−1)²（完全平方），两者相差 2m，你把它们当成一回事，后面的式子自然全乱。<br><b>更根本的问题：</b>题目说「证勾股数」，那就<b>只有一个动作</b>——把 a² + b² 算出来，看它等不等于 c²。你绕到 (m+1)² 上去了，方向偏了。"
        },
        {
          "t": "B. 他漏写了「m 是大于 1 的整数」这个条件",
          "ok": false,
          "why": "❌ 这个条件确实要用（保证 a、b、c 都是正数），但它不是你卡住的原因——你是算到一半算不下去了，不是忘了写条件。"
        },
        {
          "t": "C. 平方展开算错了",
          "ok": false,
          "why": "❌ (m+1)²、4m 这些展开本身没错，问题是<b>这些式子跟题目要证的东西没关系</b>。算得再对也没用——这就是「方向比速度重要」。"
        }
      ]
    },
    {
      "kind": "read",

      "title": "第 17 题正确写法：「证勾股数」只有一个动作",
      "html": "<p>先记住这句话：</p><div class=\"note\" style=\"font-size:16px;text-align:center\"><b>「证明三个数是勾股数」= 证明 a² + b² = c²（且它们都是正整数）</b></div><p>就这么简单粗暴。因为勾股数的定义就是「满足两小平方和等于最大平方的三个正整数」。</p><p><b>标准解答：</b></p><div class=\"note\">a² + b² = (2m)² + (m² − 1)²<br>　　　= 4m² + (m⁴ − 2m² + 1)　　← 完全平方展开，别跳步<br>　　　= m⁴ + 2m² + 1<br>　　　= (m² + 1)²<br>　　　= c²<br>又 ∵ m &gt; 1 且 m 是整数，∴ a = 2m、b = m² − 1、c = m² + 1 都是正整数<br>∴ a² + b² = c²，即 a、b、c 为勾股数。</div><div class=\"note\" style=\"border-left-color:#1f9d6b\"><b>卡点在哪里？在「完全平方展开」这一步：</b><br>(m² − 1)² = m⁴ − 2m² + 1 —— 这是八年级必须练到「不用想」的基本功。<br>你把 b 记成 (m−1)²，说明<b>「平方差 m²−1」和「完全平方 (m−1)²」在你脑子里还是一团</b>。<br>课后请把这两个写 20 遍：<br><b>m² − 1 = (m+1)(m−1)</b>（平方差，因式分解）<br><b>(m−1)² = m² − 2m + 1</b>（完全平方，展开）</div><img src=\"e0913_q17.jpg\" style=\"width:100%;max-width:430px;border:1px solid #ddd;border-radius:8px;display:block;margin:10px auto\">"

      "html": "<p>题目：一扇高 2 m、宽 1.5 m 的门框，三块薄木板：①长3m宽2.7m　②长2.8m宽2.8m　③长4m宽2.4m。能从这扇门通过的木板是？</p><p>你选了 <b>B（②号）</b>，正确的是 <b>C（③号）</b>。红笔已经圈出来了。</p><img src=\"e0913_q5.jpg\" style=\"width:100%;max-width:470px;border:1px solid #ddd;border-radius:8px;display:block;margin:10px auto\"><p><b>你想的是什么？</b>大概是「②号是 2.8×2.8 的正方形，最方正，最好过」——但门框不是方形的，它是 2×1.5 的长方形。</p><div class=\"note\"><b>关键翻译：木板斜着穿门的时候，能从门里过去的最大「宽度」= 门框的对角线。</b><br>门框对角线 = √(2² + 1.5²) = √(4 + 2.25) = √6.25 = <b>2.5 m</b><br>所以木板的<b>长和宽里至少要有一个小于 2.5 m</b>（那个方向顺着对角线穿过去）：<br>① 长3、宽2.7 → 两个都 &gt; 2.5　✗<br>② 长2.8、宽2.8 → 两个都 &gt; 2.5　✗<br>③ 长4、宽2.4 → 宽 2.4 &lt; 2.5　✓<br>∴ 选 <b>C</b></div><div class=\"note\" style=\"border-left-color:#c0392b\"><b>你疏忽的那个点：</b>判断「能不能通过」看的是木板的<b>截面尺寸</b>（长和宽），不是它的长度。④号木板长 4 m 看着最吓人，但它的宽只有 2.4 m，反而是唯一能过的。</div>"

      "tag": "B",
      "title": "第 6 题：赵爽弦图——「外围」到底是哪几段",
      "html": "<p>题目：赵爽弦图里四个全等直角三角形，AC = 6，BC = 5。把「边长为 6 的直角边」向外延长一倍，得到数学风车，求风车外围周长。</p><p>你选了 <b>B（52）</b>，正确答案是 <b>D（76）</b>。</p><img src=\"e0913_q56.jpg\" style=\"width:100%;max-width:470px;border:1px solid #ddd;border-radius:8px;display:block;margin:10px auto\"><p><b>你算对了哪一半？</b>你把 6 延长一倍得到 12，然后用勾股算出斜边：√(5² + 12²) = √169 = 13。这一步完全正确！</p><p><b>你漏了哪一半？</b>你以为外围就是 4 条斜边，所以 4 × 13 = 52。但风车的外围<b>每一片都是由「斜边 13」和「延长段 6」两段组成的</b>：</p><div class=\"note\">风车外围周长 = (13 + 6) × 4 = 19 × 4 = <b>76</b>　→ 选 <b>D</b></div><div class=\"note\" style=\"border-left-color:#1f9d6b\"><b>这道题教你的动作：</b>遇到「求某个复杂图形的周长」，先做一件事——<b>沿着图形的边，用手指头一段一段地数一圈</b>，把每一段是什么、多长，全部列出来，最后再加。<br>千万别凭「大概是这样」就乘 4。你的 52 就是「凭感觉数漏了两段」的典型。</div>"

      "title": "第 9 题：网格求角——把两个角「搬到一起」",
      "html": "<p>题目：正方形网格里 A、B、C、D 都是格点，求 ∠BAC + ∠DAC。</p><img src=\"e0913_q9.jpg\" style=\"width:100%;max-width:470px;border:1px solid #ddd;border-radius:8px;display:block;margin:10px auto\"><p>这题的思路非常经典，值得单独记一个套路：</p><div class=\"note\"><b>「两个分散的角相加」怎么办？——把它们搬到一起。</b><br>搬角最常用的工具是<b>轴对称（翻折）</b>：</div><p><b>官方解法（三步）：</b></p><ol><li><b>作对称点：</b>作点 B 关于直线 AC 的对称点 B′，连接 B′A、B′D。<br>由对称性得 <b>∠BAC = ∠B′AC</b> —— 角搬过来了！</li><li><b>算三边平方：</b><br>AB′² = 1² + 3² = 10<br>B′D² = 1² + 3² = 10<br>AD² = 4² + 2² = 20</li><li><b>逆定理出场：</b>∵ AB′ = B′D 且 AB′² + B′D² = 10 + 10 = 20 = AD²<br>∴ △AB′D 是<b>等腰直角三角形</b> → <b>∠B′AD = 45°</b><br>∴ ∠BAC + ∠DAC = ∠B′AC + ∠DAC = ∠B′AD = <b>45°</b>　→ 选 B</li></ol><div class=\"note\" style=\"border-left-color:#c0392b\"><b>注意这题又用到了「倒着用」！</b><br>算出三个平方（10、10、20）→ 发现 10+10=20 → 判定等腰直角。<br>所以你看：<b>漏洞①（逆定理）和漏洞②（图形转化）经常是连着一起考的</b>。这也是为什么单独补一个不够，得一起补。</div>"

      "html": "<p>题目：棱长分别为 3⅗ cm、3 cm 的两个正方体如图放置，P 在 E₁F₁ 上且 E₁P = ⅓E₁F₁，蚂蚁沿表面从 A 爬到 P，求最短路程。</p><p>你留白了。这题属于「立体图形表面最短路径」，是必考模型，套路非常固定：</p><img src=\"e0913_q16.jpg\" style=\"width:100%;max-width:470px;border:1px solid #ddd;border-radius:8px;display:block;margin:10px auto\"><div class=\"note\"><b>三句话，背下来：</b><br>① <b>沿棱剪开摊平</b>——把立体图形变成一张平面图（虚线就是剪开的那条棱）<br>② <b>两点之间线段最短</b>——摊平后，A 和 P 直接连一条直线<br>③ <b>把所有可能的走法都比一遍</b>——同一个 A、P，可能有好几种摊平方式，每种算一遍勾股，<b>取最小的那个</b></div>\n<svg viewBox=\"0 0 460 300\" style=\"width:100%;max-width:470px;background:#fff;border:1px solid #ddd;border-radius:8px\">\n  <text x=\"16\" y=\"24\" font-size=\"14\" fill=\"#2c3e50\" font-weight=\"bold\">立体表面最短路径：把盒子「剪开摊平」</text>\n  <rect x=\"55\" y=\"150\" width=\"280\" height=\"120\" fill=\"#f2f7ff\" stroke=\"#4a7dbd\" stroke-width=\"2\"/>\n  <rect x=\"335\" y=\"150\" width=\"80\" height=\"60\" fill=\"#ffe9e6\" stroke=\"#c0392b\" stroke-width=\"2\"/>\n  <line x1=\"55\" y1=\"150\" x2=\"335\" y2=\"150\" stroke=\"#8a94a6\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/>\n  <line x1=\"55\" y1=\"150\" x2=\"395\" y2=\"210\" stroke=\"#1f9d6b\" stroke-width=\"2.8\"/>\n  <circle cx=\"55\" cy=\"150\" r=\"5.5\" fill=\"#1f9d6b\"/>\n  <circle cx=\"395\" cy=\"210\" r=\"5.5\" fill=\"#c0392b\"/>\n  <text x=\"30\" y=\"142\" font-size=\"15\" fill=\"#1f9d6b\" font-weight=\"bold\">A</text>\n  <text x=\"402\" y=\"228\" font-size=\"15\" fill=\"#c0392b\" font-weight=\"bold\">P</text>\n  <text x=\"150\" y=\"290\" font-size=\"13\" fill=\"#5b6472\">摊平后：水平 = 各段横着加，竖直 = 各段竖着加</text>\n  <text x=\"200\" y=\"188\" font-size=\"13.5\" fill=\"#1f9d6b\" font-weight=\"bold\">两点连线最短</text>\n  <path d=\"M 355 158 L 341 158 M 341 158 L 341 172\" stroke=\"#c0392b\" stroke-width=\"1.2\" fill=\"none\"/>\n  <rect x=\"345\" y=\"150\" width=\"0\" height=\"0\" fill=\"none\"/>\n  <text x=\"348\" y=\"146\" font-size=\"12.5\" fill=\"#c0392b\">高</text>\n  <text x=\"190\" y=\"142\" font-size=\"12.5\" fill=\"#4a7dbd\">横着摊开的长度</text>\n</svg>\n<p><b>具体到这道题：</b>关键是把「横向走了多少」和「竖向走了多少」分别加起来。</p><ul><li>横向 = 大正方体的棱长 + P 到左边那个顶点的距离</li><li>竖向 = 大正方体棱长 + 小正方体棱长</li><li>然后斜边 = √(横向² + 竖向²)</li></ul><div class=\"note\">这道题的正确答案是 <b>16 cm</b>。但比答案更重要的是：<b>你要能自己画出展开图</b>。下次遇到蚂蚁题，第一件事就是在草稿纸上画一排方块摊平的样子——画出来了，这题就做出来了 80%。</div>"

      "html": "<p>第 10 题：正方形 ABCD 边长 4，面积记作 S₁；以 AB 为斜边向外作等腰直角三角形 EAB，再以它的一条直角边为边作正方形，面积记作 S₂；……按此规律继续，则 S₇ 的值是？</p><p>你选了 C（(½)³），正确答案是 <b>D（(½)²）</b>。</p><img src=\"e0913_q10.jpg\" style=\"width:100%;max-width:470px;border:1px solid #ddd;border-radius:8px;display:block;margin:10px auto\"><div class=\"note\"><b>规律题的唯一正确姿势：先老老实实算出前三项。</b><br>不要看到「S₇」就头晕，也不要凭选项猜。算前三项，规律自己会跳出来。</div><p><b>一步步算：</b></p><table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:10px 0\"><tr style=\"background:#eef1fe\"><th style=\"border:1px solid #dfe3ee;padding:8px\">项</th><th style=\"border:1px solid #dfe3ee;padding:8px\">它是什么</th><th style=\"border:1px solid #dfe3ee;padding:8px\">怎么算</th><th style=\"border:1px solid #dfe3ee;padding:8px\">结果</th></tr><tr><td style=\"border:1px solid #dfe3ee;padding:8px\">S₁</td><td style=\"border:1px solid #dfe3ee;padding:8px\">正方形 ABCD</td><td style=\"border:1px solid #dfe3ee;padding:8px\">4²</td><td style=\"border:1px solid #dfe3ee;padding:8px\"><b>16</b></td></tr><tr><td style=\"border:1px solid #dfe3ee;padding:8px\">S₂</td><td style=\"border:1px solid #dfe3ee;padding:8px\">以直角边 EA 为边的正方形</td><td style=\"border:1px solid #dfe3ee;padding:8px\">2EA² = AB² = 16 → EA² = 8</td><td style=\"border:1px solid #dfe3ee;padding:8px\"><b>8</b></td></tr><tr><td style=\"border:1px solid #dfe3ee;padding:8px\">S₃</td><td style=\"border:1px solid #dfe3ee;padding:8px\">对 S₂ 重复同样动作</td><td style=\"border:1px solid #dfe3ee;padding:8px\">½ × S₂</td><td style=\"border:1px solid #dfe3ee;padding:8px\"><b>4</b></td></tr><tr><td style=\"border:1px solid #dfe3ee;padding:8px\">S₄</td><td style=\"border:1px solid #dfe3ee;padding:8px\">同上</td><td style=\"border:1px solid #dfe3ee;padding:8px\">½ × S₃</td><td style=\"border:1px solid #dfe3ee;padding:8px\"><b>2</b></td></tr></table><div class=\"note\">看到规律了吗？<b>16 → 8 → 4 → 2 → … 每次×½。</b><br>所以 Sₙ = 16 × (½)<sup>n−1</sup>，整理一下就得到 <b>Sₙ = (½)<sup>n−5</sup></b>。<br>要求 S₇：S₇ = (½)<sup>7−5</sup> = (½)² → 选 <b>D</b>。</div><div class=\"note\" style=\"border-left-color:#1f9d6b\"><b>为什么「每次÷2」？</b>因为「以一条边为斜边作等腰直角三角形，再用它的直角边作正方形」这个动作，本质是把边长除以 √2（斜边²=2×直角边²），而<b>面积是边长的平方，所以面积除以 2</b>。<br>看懂这一层，你连算都不用算，直接就能写 Sₙ。</div>"

window.COURSE = COURSE;


/* ===================== 渲染引擎（一般不用改） ===================== */
const stage = document.getElementById('stage');
document.getElementById('courseTitle').textContent = COURSE.title;
document.getElementById('courseSub').textContent = COURSE.subtitle;
const bar = document.getElementById('bar');
let cur = 0;

function scrollTop(){
  const el = document.querySelector('.wrap');
  if (el && el.scrollIntoView) { try{ el.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){} }
}

function render(i){
  cur = i;
  const total = COURSE.steps.length;
  bar.style.width = Math.round((i)/(total-1)*100) + '%';
  stage.innerHTML = '';
  const s = COURSE.steps[i];
  const card = document.createElement('div');
  card.className = 'step active';
  let inner = '';
  if (s.tag) inner += `<span class="tag">${s.tag}</span>`;
  inner += `<h2>${s.title}</h2>`;
  if (s.kind === 'quiz'){
    inner += `<p>${s.prompt}</p><div class="opts" id="opts"></div><div class="fb" id="fb"></div>`;
  } else {
    inner += s.html || '';
  }
  // 导航按钮
  const isLast = (i === total-1);
  inner += `<div class="nav">`;
  inner += i>0 ? `<button class="btn btn-back" id="back">← 上一步</button>` : `<span></span>`;
  if (!isLast){
    inner += `<button class="btn btn-next" id="next">下一步 →</button>`;
  } else if (s.kind !== 'summary'){
    inner += `<button class="btn btn-next" id="next">完成 ✓</button>`;
  } else {
    inner += `<span></span>`;
  }
  inner += `</div>`;
  card.innerHTML = inner;
  stage.appendChild(card);

  if (s.kind === 'quiz') buildQuiz(s, card);
  // 绑定导航
  const nextBtn = card.querySelector('#next');
  if (nextBtn){
    if (s.kind === 'quiz'){ nextBtn.disabled = true; } // 答题后才解锁
    nextBtn.addEventListener('click', ()=>{ if(!nextBtn.disabled) render(i+1); });
  }
  const backBtn = card.querySelector('#back');
  if (backBtn) backBtn.addEventListener('click', ()=> render(i-1));
  scrollTop();
}

function buildQuiz(s, card){
  const optsBox = card.querySelector('#opts');
  const fb = card.querySelector('#fb');
  const nextBtn = card.querySelector('#next');
  s.options.forEach((o, idx)=>{
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="mk">${String.fromCharCode(65+idx)}</span><span>${o.t}</span>`;
    div.addEventListener('click', ()=>{
      // 锁定所有选项（避免重复点）
      optsBox.querySelectorAll('.opt').forEach(el=>{ el.classList.add('locked'); });
      // 先启用"下一步"（关键：绝不被反馈 handler 卡住）
      if (nextBtn) nextBtn.disabled = false;
      // 标出对错
      div.classList.add(o.ok ? 'correct' : 'wrong', 'chosen');
      if (!o.ok){
        // 顺便高亮正确答案，让学生看到正解
        optsBox.querySelectorAll('.opt').forEach((el,k)=>{ if(s.options[k].ok) el.classList.add('correct'); });
      }
      // 揭示评语（try/catch 兜底）
      try{
        fb.className = 'fb show ' + (o.ok ? 'ok' : 'bad');
        fb.innerHTML = (o.ok ? '✅ <b>答对了：</b>' : '⚠️ <b>再看一眼：</b>') + o.why;
      }catch(e){ /* 反馈出错也不影响下一步 */ }
      scrollTop();
    });
    optsBox.appendChild(div);
  });
}

render(0);
</script>
