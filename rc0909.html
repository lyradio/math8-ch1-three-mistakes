" r=\"4\" fill=\"#2c3e50\"/><circle cx=\"148.5\" cy=\"203.1\" r=\"4.5\" fill=\"#c0392b\"/>\n  <circle cx=\"78.7\" cy=\"175.9\" r=\"4.5\" fill=\"#3d9c63\"/>\n  <text x=\"78\" y=\"266\" font-size=\"14\" fill=\"#2c3e50\" font-weight=\"bold\">A</text>\n  <text x=\"208\" y=\"30\" font-size=\"14\" fill=\"#2c3e50\" font-weight=\"bold\">B</text>\n  <text x=\"330\" y=\"268\" font-size=\"14\" fill=\"#2c3e50\" font-weight=\"bold\">C</text>\n  <text x=\"154\" y=\"212\" font-size=\"14\" fill=\"#c0392b\" font-weight=\"bold\">Q</text>\n  <text x=\"58\" y=\"172\" font-size=\"14\" fill=\"#3d9c63\" font-weight=\"bold\">Q′</text>\n  <text x=\"126\" y=\"238\" font-size=\"11.5\" fill=\"#3d9c63\">QA=5</text>\n  <text x=\"186\" y=\"128\" font-size=\"11.5\" fill=\"#e67e22\">QB=12</text>\n  <text x=\"96\" y=\"228\" font-size=\"11.5\" fill=\"#b8860b\">60°</text>\n  <text x=\"120\" y=\"228\" font-size=\"11\" fill=\"#8a8a8a\">150°</text>\n  <text x=\"168\" y=\"185\" font-size=\"11.5\" fill=\"#c0392b\">90°</text>\n  <text x=\"156\" y=\"106\" font-size=\"12\" fill=\"#c0392b\" font-weight=\"bold\">Q′B=13</text>\n  <text x=\"96\" y=\"160\" font-size=\"11.5\" fill=\"#3d9c63\">QQ′=5</text>\n  <text x=\"64\" y=\"244\" font-size=\"11\" fill=\"#e67e22\">旋转 60°</text>\n</svg><p style='background:#f4f9f4;border:2px solid #3d9c63;border-radius:10px;padding:12px 16px;font-size:15px;line-height:2'><b>① 旋转</b>：将 △AQC 绕 A 逆时针旋转 60°（C→B），Q→Q′，连接 QQ′<br><b>② 全等</b>：△AQ′B≌△AQC → Q′B=QC，AQ′=AQ=5<br><b>③ 等边</b>：∠QAQ′=60°（旋转角）+ AQ=AQ′ → △AQQ′ 等边 → QQ′=5，∠AQQ′=60°<br><b>④ 直角</b>：∠BQQ′=∠BQA−∠AQQ′=<b>150°−60°=90°</b><br><b>⑤ 勾股</b>：Q′B²=QB²+QQ′²=12²+5²=169 → Q′B=13<br><b>⑥ 搬回</b>：QC=Q′B=<b>13</b></p><p>你的版本只有 ①②⑤⑥，缺的 ③④ 恰好是「直角从哪来」的完整论证。<b>数字一样，分不一样</b>——中考按步骤给分，跳一步丢一步。</p>"

      "html": "<p>其实还能转另一个三角形——把含 150° 角的 △AQB 绕 A <b>顺时针</b>转 60°（B→C，Q→Q″）：</p><p>🔹 Q″C = QB = 12（全等搬运）<br>🔹 △AQQ″ 等边 → QQ″=5，∠AQ″Q=60°<br>🔹 ∠CQ″Q = ∠AQB − ∠AQ″Q = 150° − 60° = <b>90°</b><br>🔹 QC = √(12²+5²) = 13 ✓ 殊途同归</p><p style='background:#fff8ec;border:2px solid #e67e22;border-radius:10px;padding:10px 14px'>🔥 <b>两条路的共同心脏：150° − 60° = 90°</b>。旋转只是搬运工，把 150° 的大角搬到能减 60° 的位置，直角一出生，勾股立刻收工。6-8-10 和 5-12-13 都是它的观众。</p>"

window.COURSE = COURSE;


/* ===================== 渲染引擎（一般不用改） ===================== */
const stage = document.getElementById('stage');
document.getElementById('courseTitle').textContent = COURSE.title;
document.getElementById('courseSub').textContent = COURSE.subtitle;
const bar = document.getElementById('bar');
let cur = 0;

function scrollTop(){
  const el = document.querySelector('.wrap');
  if (el && el.scrollIntoView) { try{ el.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){} }
}

function render(i){
  cur = i;
  const total = COURSE.steps.length;
  bar.style.width = Math.round((i)/(total-1)*100) + '%';
  stage.innerHTML = '';
  const s = COURSE.steps[i];
  const card = document.createElement('div');
  card.className = 'step active';
  let inner = '';
  if (s.tag) inner += `<span class="tag">${s.tag}</span>`;
  inner += `<h2>${s.title}</h2>`;
  if (s.kind === 'quiz'){
    inner += `<p>${s.prompt}</p><div class="opts" id="opts"></div><div class="fb" id="fb"></div>`;
  } else {
    inner += s.html || '';
  }
  // 导航按钮
  const isLast = (i === total-1);
  inner += `<div class="nav">`;
  inner += i>0 ? `<button class="btn btn-back" id="back">← 上一步</button>` : `<span></span>`;
  if (!isLast){
    inner += `<button class="btn btn-next" id="next">下一步 →</button>`;
  } else if (s.kind !== 'summary'){
    inner += `<button class="btn btn-next" id="next">完成 ✓</button>`;
  } else {
    inner += `<span></span>`;
  }
  inner += `</div>`;
  card.innerHTML = inner;
  stage.appendChild(card);

  if (s.kind === 'quiz') buildQuiz(s, card);
  // 绑定导航
  const nextBtn = card.querySelector('#next');
  if (nextBtn){
    if (s.kind === 'quiz'){ nextBtn.disabled = true; } // 答题后才解锁
    nextBtn.addEventListener('click', ()=>{ if(!nextBtn.disabled) render(i+1); });
  }
  const backBtn = card.querySelector('#back');
  if (backBtn) backBtn.addEventListener('click', ()=> render(i-1));
  scrollTop();
}

function buildQuiz(s, card){
  const optsBox = card.querySelector('#opts');
  const fb = card.querySelector('#fb');
  const nextBtn = card.querySelector('#next');
  s.options.forEach((o, idx)=>{
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="mk">${String.fromCharCode(65+idx)}</span><span>${o.t}</span>`;
    div.addEventListener('click', ()=>{
      // 锁定所有选项（避免重复点）
      optsBox.querySelectorAll('.opt').forEach(el=>{ el.classList.add('locked'); });
      // 先启用"下一步"（关键：绝不被反馈 handler 卡住）
      if (nextBtn) nextBtn.disabled = false;
      // 标出对错
      div.classList.add(o.ok ? 'correct' : 'wrong', 'chosen');
      if (!o.ok){
        // 顺便高亮正确答案，让学生看到正解
        optsBox.querySelectorAll('.opt').forEach((el,k)=>{ if(s.options[k].ok) el.classList.add('correct'); });
      }
      // 揭示评语（try/catch 兜底）
      try{
        fb.className = 'fb show ' + (o.ok ? 'ok' : 'bad');
        fb.innerHTML = (o.ok ? '✅ <b>答对了：</b>' : '⚠️ <b>再看一眼：</b>') + o.why;
      }catch(e){ /* 反馈出错也不影响下一步 */ }
      scrollTop();
    });
    optsBox.appendChild(div);
  });
}

render(0);
</script>
